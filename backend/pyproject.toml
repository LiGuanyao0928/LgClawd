[project]
name = "clawd-studio-backend"
version = "0.1.0"
description = "Clawd Studio 后端：多 Agent 内容生产系统"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13",
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
